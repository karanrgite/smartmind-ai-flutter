name: smartmind_ai
description: "Personalized Ai"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5
  # Networking
  dio: ^5.4.0
  # Dependency injection
  get_it: ^7.6.7
  # Local storage / offline cache
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  # AI reply rendering
  flutter_markdown: ^0.6.1
  # Voice input & output
  speech_to_text: ^7.0.0
  flutter_tts: ^3.8.5
  # File / image upload
  image_picker: ^1.0.7
  # Network status check
  connectivity_plus: ^5.0.2
  # Animations (loading states)
  lottie: ^3.1.0
 # Navigation
  go_router: ^13.0.0
  permission_handler: ^11.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true